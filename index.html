<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý học viên</title>
  <link rel="preconnect" href="https://zrmgunriwvcjppjykngk.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="sm.css?v=37">
  <script>try{if(localStorage.getItem("sm_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body>
  <div class="sm-app" id="app" hidden>
    <aside class="sm-side" id="side">
      <div class="sm-brand"><span class="logo">🎓</span><span id="brandName">Quản lý học viên</span></div>
      <nav class="sm-nav" id="nav">
        <a href="#me" data-nav="me" id="navMe" hidden><span class="ic">🙋</span> Của tôi</a>
        <a href="#dashboard" data-nav="dashboard"><span class="ic">📊</span> Tổng quan</a>
        <div class="grp">Quản lý</div>
        <a href="#students" data-nav="students"><span class="ic">👤</span> Học viên</a>
        <a href="#classes" data-nav="classes"><span class="ic">🏫</span> Lớp học</a>
        <a href="#schedule" data-nav="schedule"><span class="ic">🗓️</span> Lịch học</a>
        <a href="#ops" data-nav="ops"><span class="ic">🧭</span> Điều hành</a>
        <a href="#attendance" data-nav="attendance"><span class="ic">✅</span> Điểm danh</a>
        <a href="#checkin" data-nav="checkin"><span class="ic">📲</span> Chấm công GV</a>
        <div class="grp">Tài chính</div>
        <a href="#tuition" data-nav="tuition"><span class="ic">🧾</span> Học phí</a>
        <a href="#payments" data-nav="payments"><span class="ic">💵</span> Thanh toán</a>
        <a href="#payroll" data-nav="payroll"><span class="ic">👩‍🏫</span> Lương giáo viên</a>
        <div class="grp">Khác</div>
        <a href="#reports" data-nav="reports"><span class="ic">📈</span> Báo cáo</a>
        <a href="#audit" data-nav="audit"><span class="ic">📜</span> Nhật ký</a>
        <a href="#handbook" data-nav="handbook"><span class="ic">📖</span> Hướng dẫn sử dụng</a>
        <a href="#tenants" data-nav="tenants" id="navTenants" hidden><span class="ic">🏢</span> Quản lý giáo viên</a>
        <a href="#settings" data-nav="settings"><span class="ic">⚙️</span> Cài đặt</a>
      </nav>
    </aside>
    <div class="sm-backdrop" id="backdrop"></div>

    <div class="sm-main">
      <div class="sm-top">
        <button class="sm-burger" id="burger" aria-label="Menu">☰</button>
        <div class="search"><input id="globalSearch" placeholder="🔎 Tìm kiếm (sắp có)…" disabled></div>
        <button class="btn ghost" id="themeBtn" title="Sáng/tối" style="padding:.4rem .6rem;">🌙</button>
        <div class="who"><span id="whoName" class="muted"></span>
          <button class="btn ghost" id="logout" style="padding:.4rem .7rem;">Đăng xuất</button></div>
      </div>
      <main class="sm-content" id="content">
        <div class="placeholder"><span class="spinner"></span></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=37"></script>
  <script src="sm-lib.js?v=37"></script>
  <script src="sm-students.js?v=37"></script>
  <script src="sm-classes.js?v=37"></script>
  <script src="sm-schedule.js?v=37"></script>
  <script src="sm-teaching.js?v=37"></script>
  <script src="sm-payroll.js?v=37"></script>
  <script src="sm-checkin.js?v=37"></script>
  <script src="sm-teacher.js?v=37"></script>
  <script src="sm-tour.js?v=37"></script>
  <script src="sm-attendance.js?v=37"></script>
  <script src="sm-tuition.js?v=37"></script>
  <script src="sm-payments.js?v=37"></script>
  <script src="sm-dashboard.js?v=37"></script>
  <script src="sm-reports.js?v=37"></script>
  <script src="sm-audit.js?v=37"></script>
  <script src="sm-tenants.js?v=37"></script>
  <script src="sm-handbook.js?v=37"></script>
  <script>
    const $ = id => document.getElementById(id);
    let ME = null, SETTINGS = null, TENANT = null;   // TENANT: {account_type, features} — quyết định module hiển thị

    // sections not built yet → friendly placeholder with the phase number
    const PHASES = {
      dashboard: 9, students: 2, classes: 3, schedule: 4,
      attendance: 5, tuition: 6, payments: 7, reports: 10
    };
    const TITLES = {
      dashboard: "Tổng quan", students: "Học viên", classes: "Lớp học", schedule: "Lịch học",
      attendance: "Điểm danh", tuition: "Học phí", payments: "Thanh toán", reports: "Báo cáo", settings: "Cài đặt"
    };

    function placeholder(pane) {
      const p = PHASES[pane];
      return `<h1>${SM.esc(TITLES[pane])}</h1>
        <div class="card placeholder">
          <div class="big">🛠️</div>
          <p><b>Đang xây dựng — Giai đoạn ${p}</b></p>
          <p class="muted">Phần này sẽ hoạt động ở giai đoạn ${p} theo kế hoạch trong DESIGN.md.</p>
        </div>`;
    }

    // GĐ9: bảng số liệu tổng quan sống ở module Dashboard (sm-dashboard.js)
    function renderDashboard() { return Dashboard.render($("content"), ME); }

    async function renderSettings() {
      $("content").innerHTML = `<h1>Cài đặt</h1><div class="card placeholder"><span class="spinner"></span></div>`;
      const s = await SM.refSettings();
      SETTINGS = s || SETTINGS || {};
      const owner = ME.profile.role === "owner";
      $("content").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
          <h1>Cài đặt</h1><button class="btn ghost" id="st-tour">🧭 Xem lại hướng dẫn nhanh</button></div>
        <div class="card" style="padding:1.3rem;max-width:560px;">
          <h2 style="font-size:1.1rem;margin:.1rem 0 .8rem;">Thông tin trung tâm</h2>
          <div class="field"><label>Tên trung tâm</label>
            <input id="st-name" value="${SM.esc(SETTINGS.center_name || "")}" ${owner ? "" : "disabled"}></div>
          <div class="field"><label>Ngày chốt học phí hằng tháng (1–28)</label>
            <input id="st-billing" type="number" min="1" max="28" value="${SETTINGS.billing_day || 1}" ${owner ? "" : "disabled"}></div>
          <div class="field"><label>Tiền tệ · Múi giờ · Định dạng ngày</label>
            <input value="VND · ${SM.TZ} · DD/MM/YYYY" disabled></div>
          ${owner ? `<button class="btn" id="st-save">💾 Lưu cài đặt</button>` : `<p class="muted">Chỉ chủ sở hữu được sửa cài đặt.</p>`}
          <p class="msg" id="st-msg"></p>
        </div>
        <div class="card" style="padding:1.3rem;max-width:560px;margin-top:1rem;">
          <h2 style="font-size:1.1rem;margin:.1rem 0 .6rem;">Tài khoản đang đăng nhập</h2>
          <p style="margin:.2rem 0;">${SM.esc(ME.profile.full_name || ME.user.email)} · <span class="badge mute">${SM.roleLabel(ME.profile.role)}</span></p>
        </div>
        ${owner && TENANT && TENANT.account_type === "center" ? `<div class="card" style="padding:1.3rem;max-width:560px;margin-top:1rem;">
          <h2 style="font-size:1.1rem;margin:.1rem 0 .4rem;">Tài khoản giáo viên</h2>
          <p class="muted" style="font-size:.85rem;margin:0 0 .6rem;">Liên kết giáo viên với một tài khoản đăng nhập để họ tự xem lịch, lớp, chấm công và lương của mình. Tạo tài khoản (email + mật khẩu) trong <b>Supabase → Authentication</b> trước (dùng email <b>khác</b> email chủ), rồi liên kết bằng email tại đây.</p>
          <button class="btn ghost" id="ta-add" style="margin-bottom:.7rem;">➕ Thêm giáo viên</button>
          <div id="ta-list"><span class="spinner"></span></div>
        </div>` : ""}`;
      if (owner) $("st-save").addEventListener("click", async () => {
        const msg = $("st-msg");
        const name = $("st-name").value.trim();
        const billing = Math.min(28, Math.max(1, parseInt($("st-billing").value, 10) || 1));
        $("st-save").disabled = true;
        const { error } = await sb.from("settings").upsert({ tenant_id: ME.profile.tenant_id, center_name: name, billing_day: billing, updated_at: new Date().toISOString() }, { onConflict: "tenant_id" });
        $("st-save").disabled = false;
        if (error) { msg.textContent = "Không lưu được: " + error.message; msg.className = "msg err"; return; }
        SM.invalidate("settings");
        SETTINGS.center_name = name; SETTINGS.billing_day = billing;
        $("brandName").textContent = name || "Quản lý học viên";
        msg.textContent = "✓ Đã lưu."; msg.className = "msg";
        SM.toast("✓ Đã lưu cài đặt", "ok");
      });
      $("st-tour").onclick = () => Tour.startDefault(TENANT, ME.profile.role);
      if (owner && $("ta-list")) {
        loadTeacherAccounts();
        $("ta-add").onclick = async () => {
          const name = window.prompt("Tên giáo viên:");
          if (!name || !name.trim()) return;
          const { error } = await sb.from("teachers").insert({ full_name: name.trim() });
          if (error) return SM.toast("Không thêm được: " + error.message, "err");
          SM.invalidate("teachers"); SM.toast("✓ Đã thêm giáo viên", "ok"); loadTeacherAccounts();
        };
      }
    }

    async function loadTeacherAccounts() {
      const wrap = $("ta-list"); if (!wrap) return;
      const { data: ts, error } = await sb.from("teachers").select("id,full_name,user_id").is("archived_at", null).order("full_name");
      if (error) { wrap.innerHTML = `<p class="muted">Không tải được danh sách: ${SM.esc(error.message)}</p>`; return; }
      if (!ts || !ts.length) { wrap.innerHTML = `<p class="muted">Chưa có giáo viên nào. Thêm giáo viên khi tạo lớp.</p>`; return; }
      wrap.innerHTML = ts.map(t => `<div style="display:flex;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--line);">
        <span style="flex:1;"><b>${SM.esc(t.full_name)}</b> ${t.user_id ? '<span class="badge ok">đã liên kết</span>' : '<span class="badge mute">chưa liên kết</span>'}</span>
        ${t.user_id ? `<button class="btn ghost" data-unlink="${t.id}" style="color:var(--danger);border-color:var(--danger);padding:.3rem .6rem;">Gỡ</button>`
          : `<button class="btn ghost" data-link="${t.id}" style="padding:.3rem .6rem;">🔗 Liên kết</button>`}</div>`).join("");
      wrap.querySelectorAll("[data-link]").forEach(b => b.onclick = async () => {
        const email = window.prompt("Email đăng nhập của giáo viên (đã tạo trong Supabase → Authentication):");
        if (!email || !email.trim()) return;
        b.disabled = true;
        const { error } = await sb.rpc("link_teacher_account", { p_teacher: b.dataset.link, p_email: email.trim() });
        if (error) { b.disabled = false; return SM.toast("Không liên kết được: " + error.message, "err"); }
        SM.toast("✓ Đã liên kết tài khoản giáo viên", "ok"); loadTeacherAccounts();
      });
      wrap.querySelectorAll("[data-unlink]").forEach(b => b.onclick = async () => {
        const ok = await SM.confirmDialog({ title: "Gỡ liên kết tài khoản?", danger: true, okText: "Gỡ", body: "Giáo viên sẽ không đăng nhập xem được dữ liệu của mình nữa. Tài khoản đăng nhập bị vô hiệu hóa." });
        if (!ok) return;
        const { error } = await sb.rpc("unlink_teacher_account", { p_teacher: b.dataset.unlink });
        if (error) return SM.toast("Không gỡ được: " + error.message, "err");
        SM.toast("Đã gỡ liên kết", "ok"); loadTeacherAccounts();
      });
    }

    const TEACHER_PANES = ["me", "checkin", "handbook"];
    function route() {
      const raw = (location.hash.replace("#", "") || "dashboard");
      let pane = raw.split("?")[0];
      // giáo viên: chỉ vào được cổng của mình + trang check-in + hướng dẫn
      if (ME && ME.profile.role === "teacher" && !TEACHER_PANES.includes(pane)) pane = "me";
      // module bị tắt theo loại tài khoản / gói → về Tổng quan
      else if (ME && ME.profile.role !== "teacher" && SM.MODULES.some(m => m.k === pane) && !SM.moduleEnabled(pane, TENANT)) pane = "dashboard";
      document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === pane));
      closeSide();
      if (pane === "me") return Me.render($("content"), ME);
      if (pane === "checkin") {
        const s = new URLSearchParams(raw.split("?")[1] || "").get("s");
        return s ? Checkin.renderSelfCheckin($("content"), ME, s) : Checkin.render($("content"), ME);
      }
      if (pane === "settings") return renderSettings();
      if (pane === "dashboard") return renderDashboard();
      if (pane === "students") return Students.render($("content"), ME);
      if (pane === "classes") return Classes.render($("content"), ME);
      if (pane === "schedule") return Schedule.render($("content"), ME);
      if (pane === "ops") return Ops.render($("content"), ME);
      if (pane === "attendance") return Attendance.render($("content"), ME);
      if (pane === "tuition") return Tuition.render($("content"), ME);
      if (pane === "payments") return Payments.render($("content"), ME);
      if (pane === "payroll") return Payroll.render($("content"), ME);
      if (pane === "reports") return Reports.render($("content"), ME);
      if (pane === "audit") return Audit.render($("content"), ME);
      if (pane === "tenants") return Tenants.render($("content"), ME);
      if (pane === "handbook") return Handbook.render($("content"), ME);
      $("content").innerHTML = placeholder(pane);
    }

    // mobile drawer
    const openSide = () => { $("side").classList.add("open"); $("backdrop").classList.add("on"); };
    const closeSide = () => { $("side").classList.remove("open"); $("backdrop").classList.remove("on"); };
    $("burger").addEventListener("click", openSide);
    $("backdrop").addEventListener("click", closeSide);

    $("themeBtn").addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("sm_theme", dark ? "light" : "dark"); } catch (e) {}
    });
    $("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.href = "login.html"; });
    window.addEventListener("hashchange", route);

    (async function start() {
      ME = await SM.requireAuth();
      if (!ME) return;                       // redirected to login
      // settings theo tenant (RLS tự lọc → mỗi workspace 1 dòng)
      const s = await SM.refSettings();
      SETTINGS = s || { center_name: "Quản lý học viên", billing_day: 1 };
      $("brandName").textContent = SETTINGS.center_name || "Quản lý học viên";
      $("whoName").textContent = (ME.profile.full_name || ME.user.email) + " · " + SM.roleLabel(ME.profile.role);
      // loại tài khoản + tính năng đang bật của workspace (quyết định sidebar)
      try { const { data: tn } = await sb.from("tenants").select("account_type,features,plan,status").eq("id", ME.profile.tenant_id).maybeSingle(); TENANT = tn || { account_type: "center", features: {} }; }
      catch (e) { TENANT = { account_type: "center", features: {} }; }
      // mục "Quản lý giáo viên" chỉ hiện với chủ nền tảng
      if (ME.profile.is_platform_owner) $("navTenants").hidden = false;
      // GIÁO VIÊN: chỉ hiện cổng "Của tôi" + Hướng dẫn, ẩn phần quản trị; mặc định vào #me
      const isTeacher = ME.profile.role === "teacher";
      if (isTeacher) {
        $("navMe").hidden = false;
        document.querySelectorAll("#nav a").forEach(a => { if (!["me", "handbook"].includes(a.dataset.nav)) a.hidden = true; });
        const cur = (location.hash.replace("#", "").split("?")[0]);
        if (!TEACHER_PANES.includes(cur)) location.hash = "#me";
      } else {
        // Chủ/Quản trị: ẩn các module bị tắt theo loại tài khoản / gói của workspace
        document.querySelectorAll("#nav a[data-nav]").forEach(a => {
          const k = a.dataset.nav;
          if (SM.MODULES.some(m => m.k === k) && !SM.moduleEnabled(k, TENANT)) a.hidden = true;
        });
      }
      // biểu ngữ khi đang đăng nhập hộ (impersonate)
      try {
        const imp = sessionStorage.getItem("sm_impersonate");
        if (imp) {
          const bar = document.createElement("div"); bar.className = "imp-bar";
          bar.innerHTML = `👁️ Đang xem với tư cách <b>${SM.esc(imp)}</b> — <button class="btn ghost" id="impExit" style="padding:.2rem .6rem;">Thoát</button>`;
          document.body.appendChild(bar);
          document.getElementById("impExit").addEventListener("click", async () => { sessionStorage.removeItem("sm_impersonate"); await sb.auth.signOut(); location.href = "login.html"; });
        }
      } catch (e) {}
      $("app").hidden = false;
      route();
      // Bảo trì lịch: mỗi tháng tự sinh buổi cho lớp mở (chỉ nhân viên có quyền). Chạy nền, không chặn UI.
      if (!isTeacher) { try { Classes.ensureMonthlySessions(ME.profile.tenant_id); } catch (e) {} }
      // Onboarding lần đầu — tự thích ứng theo loại tài khoản, chỉ giới thiệu module đang bật.
      let _imp = false; try { _imp = !!sessionStorage.getItem("sm_impersonate"); } catch (e) {}
      if (!isTeacher && !_imp) maybeOnboard();
    })();

    function maybeOnboard() {
      const key = "sm_onboarded_" + ME.profile.tenant_id;
      try { if (localStorage.getItem(key)) return; } catch (e) {}
      const indiv = TENANT.account_type === "individual";
      const mods = SM.MODULES.filter(m => !["dashboard", "handbook"].includes(m.k) && SM.moduleEnabled(m.k, TENANT));
      const ov = document.createElement("div"); ov.className = "sm-ov";
      ov.innerHTML = `<div class="sm-modal" style="max-width:520px;"><div class="mh"><h3>👋 Chào mừng ${SM.esc(SETTINGS.center_name || "")}</h3><button class="btn ghost" data-x="close">✕</button></div>
        <div class="mb">
          <p style="margin:.1rem 0 .7rem;">${indiv
            ? "Đây là bản <b>gọn cho giáo viên cá nhân</b> — chỉ những gì bạn cần để dạy và quản lý học viên của mình."
            : "Bạn đang quản lý một <b>trung tâm</b> — đầy đủ công cụ cho nhiều giáo viên, lớp học và tài chính."}</p>
          <p class="muted" style="font-size:.85rem;margin:0 0 .5rem;">Các mục đang bật cho bạn:</p>
          <div style="display:flex;flex-wrap:wrap;gap:.45rem;">${mods.map(m => `<span class="badge mute" style="font-size:.88rem;padding:.3rem .6rem;">${m.icon} ${SM.esc(m.l)}</span>`).join("")}</div>
          ${indiv ? `<p class="muted" style="font-size:.83rem;margin:.9rem 0 0;">Cần thêm giáo viên, chấm công, tính lương? Có thể <b>nâng cấp lên gói Trung tâm</b> bất cứ lúc nào — dữ liệu của bạn giữ nguyên.</p>` : ""}
        </div>
        <div class="mf"><button class="btn ghost" data-x="later" style="margin-left:auto;">Để sau</button><button class="btn" id="onb-tour">🧭 Xem hướng dẫn nhanh</button></div></div>`;
      document.body.appendChild(ov);
      const done = tour => { try { localStorage.setItem(key, "1"); } catch (e) {} ov.remove(); if (tour) setTimeout(() => Tour.startDefault(TENANT, ME.profile.role), 60); };
      ov.addEventListener("click", e => { if (e.target === ov || ["close", "later"].includes(e.target.dataset.x)) done(false); });
      ov.querySelector("#onb-tour").onclick = () => done(true);
    }
  </script>
</body>
</html>
